<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#18181b" />
    <title>You're offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: #fafafa;
        color: #18181b;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #09090b;
          color: #fafafa;
        }
        .card {
          border-color: #27272a;
        }
        button {
          background: #fafafa;
          color: #09090b;
        }
      }
      .card {
        max-width: 22rem;
        padding: 2rem;
        text-align: center;
        border: 1px solid #e4e4e7;
        border-radius: 12px;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        .card {
          background: #18181b;
        }
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 0.9375rem;
        line-height: 1.5;
        color: #71717a;
      }
      @media (prefers-color-scheme: dark) {
        p {
          color: #a1a1aa;
        }
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 8px;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 500;
        background: #18181b;
        color: #fafafa;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>No connection</h1>
      <p>
        This page was served from your device. When the network is back, try
        again.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
